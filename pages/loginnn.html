<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - E-commerce Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f7ff 0%, #b3e5fc 100%);
            min-height: 100vh;
        }

        /* Navigation Bar */
        .navbar {
            background: linear-gradient(135deg, #0288d1 0%, #03a9f4 100%);
            padding: 15px 0;
            box-shadow: 0 2px 10px rgba(2, 136, 209, 0.3);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo:hover {
            opacity: 0.9;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: opacity 0.3s ease;
        }

        .nav-links a:hover {
            opacity: 0.8;
        }

        /* Main Content Area */
        .main-content {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 70px);
            padding: 40px 20px;
        }

        /* Login Container - Small Size */
        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(2, 136, 209, 0.2);
            max-width: 400px;
            width: 100%;
            padding: 35px 30px;
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #0288d1 0%, #03a9f4 100%);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #0288d1;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        /* Floating label input group */
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            font-size: 15px;
            border: 2px solid #b3e5fc;
            border-radius: 8px;
            outline: none;
            transition: all 0.3s ease;
            background: transparent;
        }

        .input-group input:focus {
            border-color: #0288d1;
        }

        .input-group label {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 15px;
            pointer-events: none;
            transition: all 0.3s ease;
            background: white;
            padding: 0 5px;
        }

        /* Float label when input is focused or has value */
        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: 0;
            font-size: 12px;
            color: #0288d1;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0288d1 0%, #03a9f4 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(2, 136, 209, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Success message styles */
        .success-message {
            display: none;
            text-align: center;
            animation: fadeInScale 0.5s ease;
        }

        .success-message.active {
            display: block;
        }

        .success-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #0288d1 0%, #03a9f4 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            animation: bounceIn 0.6s ease;
        }

        .success-icon svg {
            width: 35px;
            height: 35px;
            stroke: white;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .success-message h2 {
            color: #0288d1;
            font-size: 22px;
            margin-bottom: 8px;
        }

        .success-message p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .order-details {
            background: #e0f7ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: left;
        }

        .order-details p {
            color: #333;
            font-size: 13px;
            margin: 5px 0;
        }

        /* Login form visibility */
        .login-form.hidden {
            display: none;
        }

        /* Animations */
        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        /* Error message */
        .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 10px;
            display: none;
            text-align: center;
        }

        .error-message.active {
            display: block;
        }

        /* Links */
        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #0288d1;
            text-decoration: none;
            font-size: 13px;
            margin: 0 8px;
        }

        .links a:hover {
            text-decoration: underline;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .nav-links {
                gap: 15px;
            }

            .nav-links a {
                font-size: 14px;
            }

            .login-container {
                padding: 30px 25px;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 20px;
            }

            .nav-links {
                gap: 10px;
            }

            .login-container {
                padding: 25px 20px;
            }

            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="logo">
                <span>🛒</span>
                <span>Tech-Hub</span>
            </a>
            <div class="nav-links">
                <a href="../index.html">Home</a>
                <a href="/shop">Shop</a>
                <a href="/cart">Cart</a>
                <a href="contactUs.html">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <div class="login-container">
            <!-- Login Form -->
            <div class="login-form" id="loginForm">
                <div class="header">
                    <h1>Welcome Back!</h1>
                    <p>Login to complete your purchase</p>
                </div>

                <form id="loginFormElement">
                    <div class="input-group">
                        <input type="text" id="username" placeholder=" " required>
                        <label for="username">Email or Username</label>
                    </div>

                    <div class="input-group">
                        <input type="password" id="password" placeholder=" " required>
                        <label for="password">Password</label>
                    </div>

                    <div class="error-message" id="errorMessage">
                        Please fill in all fields
                    </div>

                    <button type="submit" class="btn" id="loginBtn">
                        Login & Continue
                    </button>
                </form>

            </div>

            <!-- Success Message -->
            <div class="success-message" id="successMessage">
                <div class="success-icon">
                    <svg viewBox="0 0 24 24">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                <h2>Login Successful!</h2>
                <p>You have been successfully logged in.</p>
                
                <div class="order-details">
                    <p><strong>Order ID:</strong> <span id="orderId"></span></p>
                    <p><strong>Email:</strong> <span id="orderEmail"></span></p>
                    <p><strong>Status:</strong> Processing</p>
                </div>

                <button class="btn" onclick="redirectToHome()">
                    Continue Shopping
                </button>
            </div>
        </div>
    </div>

    <script>
        // Get form elements
        const loginFormElement = document.getElementById('loginFormElement');
        const loginForm = document.getElementById('loginForm');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');

        // Handle form submission
        loginFormElement.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get input values
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            // Hide any previous error messages
            errorMessage.classList.remove('active');

            // Accept any credentials for demo - always show success
            if (username && password) {
                // Disable button to prevent multiple submissions
                loginBtn.disabled = true;
                loginBtn.textContent = 'Processing...';

                // Simulate processing delay
                setTimeout(() => {
                    showSuccessMessage(username);
                }, 800);
            } else {
                // Show error if fields are empty
                errorMessage.textContent = 'Please fill in all fields';
                errorMessage.classList.add('active');
            }
        });

        // Show success message
        function showSuccessMessage(email) {
            // Generate random order ID
            const orderId = 'ORD-' + Math.random().toString(36).substr(2, 9).toUpperCase();
            
            // Update order details
            document.getElementById('orderId').textContent = orderId;
            document.getElementById('orderEmail').textContent = email;

            // Hide login form and show success message
            loginForm.classList.add('hidden');
            successMessage.classList.add('active');
        }

        // Redirect to home page
        function redirectToHome() {
            // Redirect to main page
            window.location.href = '../index.html';
            
            // For demo: if no backend, just reset the form
            // Comment out the line above and uncomment below for demo
            // resetForm();
        }

        // Reset form (for demo purposes)
        function resetForm() {
            loginFormElement.reset();
            loginForm.classList.remove('hidden');
            successMessage.classList.remove('active');
            loginBtn.disabled = false;
            loginBtn.textContent = 'Login & Continue';
            errorMessage.classList.remove('active');
        }

        // Demo helper: Press Ctrl+R to reset (for testing)
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'r') {
                e.preventDefault();
                resetForm();
            }
        });
    </script>
</body>
</html>
